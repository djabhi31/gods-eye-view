name: Automated Upstream Sync (Lifetime Sync)

on:
  schedule:
    # Runs every day at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/bilawalsidhu/gods-eye-view.git || true
          git fetch upstream main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run Upstream Sync Engine
        run: |
          node scripts/sync-upstream.mjs

      - name: Push Synced Updates to Main
        run: |
          git push origin main || echo "Nothing new to push."
